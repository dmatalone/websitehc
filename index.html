<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Hollywood Cinema website unavailable notice and ticket booking phone number.">
  <title>Website Unavailable | Hollywood Cinema</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px 20px; background: #fff; color: #111; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, Helvetica, sans-serif; }
    .wrap { width: min(760px, 100%); text-align: center; }
    .brand { display: flex; align-items: center; justify-content: center; gap: 18px; margin-bottom: 64px; }
    .brand-name { font-size: clamp(34px, 6vw, 64px); font-weight: 900; letter-spacing: -.045em; text-transform: uppercase; }
    .brand-logo { width: 86px; height: 86px; object-fit: contain; }
    .label { color: #c69f3e; font-size: 14px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; margin-bottom: 22px; }
    h1 { margin: 0; font-size: clamp(42px, 7vw, 72px); line-height: 1; letter-spacing: -.05em; text-transform: uppercase; }
    .message { margin: 28px auto 0; max-width: 640px; color: #555; font-size: 19px; line-height: 1.7; }
    .divider { width: 60px; height: 2px; margin: 34px auto; background: #d5b45e; }
    .phone { display: inline-block; margin-top: 8px; padding: 15px 24px; border-radius: 8px; background: #111; color: #fff; font-size: 20px; font-weight: 800; text-decoration: none; }
    .phone:hover { opacity: .88; }
    .bottom-brand { margin-top: 56px; color: #777; font-size: 12px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; }
    @media (max-width: 650px) { .brand { gap: 12px; margin-bottom: 48px; } .brand-logo { width: 60px; height: 60px; } .message { font-size: 16px; } .phone { font-size: 18px; } }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="brand">
      <div class="brand-name">Hollywood Cinema</div>
      <img class="brand-logo" src="hollywood-cinema-logo.png" alt="Hollywood Cinema logo">
    </div>
    <div class="label">Website Notice</div>
    <h1>We Apologize.</h1>
    <p class="message">The Hollywood Cinema website is currently unavailable. To book tickets, please call us using the number below.</p>
    <div class="divider"></div>
    <a class="phone" href="tel:+13312234175">(331) 223-4175</a>
    <div class="bottom-brand">Hollywood Cinema™ • Since 2023</div>
  </main>
</body>
</html>
